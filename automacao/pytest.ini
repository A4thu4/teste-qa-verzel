[pytest]
# Endereço da loja. Os testes usam caminhos relativos ("/carrinho", "/api/produtos").
base_url = https://verzel-store.qa-test-verzel-store.workers.dev
testpaths = tests
pythonpath = .
# -ra: mostra no fim o motivo de cada teste que não passou (inclui os XFAIL).
addopts = -ra --strict-markers
markers =
    api: testes que chamam a API diretamente, sem abrir navegador
    ui: testes que usam a interface da loja no navegador
